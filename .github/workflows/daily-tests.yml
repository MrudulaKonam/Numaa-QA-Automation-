name: Daily NuMaa Test Suite
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: NuMaa Daily Test Suite Report - ${{ github.run_id }}
          to: mrudula.konam@gmail.com
          from: NuMaa Test Automation
          body: Daily Playwright test run completed. Full HTML report attached and also available in the GitHub Actions run artifacts.
          attachments: playwright-report/index.html
